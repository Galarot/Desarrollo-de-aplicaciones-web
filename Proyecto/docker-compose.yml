version: '3.8'

services:
  php:
    image: php:8.2-fpm-alpine
    container_name: dblegend_php
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    environment:
      - PHP_IDE_CONFIG=serverName=Docker
    networks:
      - app

  web:
    image: nginx:alpine
    container_name: dblegend_web
    working_dir: /app
    volumes:
      - .:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - php
    networks:
      - app

  database:
    image: sqlite:latest
    container_name: dblegend_db
    volumes:
      - db_data:/data
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  db_data:
    driver: local
