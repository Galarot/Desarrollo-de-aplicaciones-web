services:
  db:
    image: mysql:8.0
    container_name: dblegends_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dblegends
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dblegends_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dblegends_app
    volumes:
      - .:/var/www/html
    environment:
      DATABASE_URL: "mysql://user:password@db:3306/dblegends?serverVersion=8.0.32&charset=utf8mb4"
      APP_ENV: dev
      APP_SECRET: c6177b079069d2551532889218d6e386
      DEFAULT_URI: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dblegends_net

  nginx:
    image: nginx:alpine
    container_name: dblegends_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dblegends_net

networks:
  dblegends_net:
    driver: bridge

volumes:
  db_data:
