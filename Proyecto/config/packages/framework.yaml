framework:
  secret: '%env(APP_SECRET)%'
  csrf_protection: ~
  http_method_override: false
  handle_all_throwables: true

  # Habilitar compresion HTTP
  http_cache: true

  session:
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax
    storage_factory_id: session.storage.factory.native

  php_errors:
    log: true

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
